<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แดชบอร์ดติดตามการใช้งาน Token ของ AI (Standalone Preview)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              claude: '#a855f7',
              codex: '#10b981',
              antigravity: '#3b82f6'
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN for standalone chart rendering -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Font Google Prompt / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const MODEL_CONFIGS = {
      ClaudeCowork: {
        name: 'ClaudeCowork',
        color: '#a855f7',
        bg: 'rgba(168, 85, 247, 0.2)',
        costPer1k: 0.015
      },
      Codex: {
        name: 'Codex',
        color: '#10b981',
        bg: 'rgba(16, 185, 129, 0.2)',
        costPer1k: 0.010
      },
      Antigravity: {
        name: 'Antigravity',
        color: '#3b82f6',
        bg: 'rgba(59, 130, 246, 0.2)',
        costPer1k: 0.008
      }
    };

    const THAI_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const THAI_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

    function generateMockData() {
      const data = [];
      const today = new Date();
      for (let i = 180; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const mult = isWeekend ? 0.35 : 1.0;
        const wave = Math.sin(i / 7) * 0.2 + 1.0;

        const claude = Math.round((Math.random() * 35000 + 25000) * mult * wave);
        const codex = Math.round((Math.random() * 45000 + 30000) * mult * wave);
        const anti = Math.round((Math.random() * 40000 + 20000) * mult * wave);

        data.push({
          date: dateStr,
          ClaudeCowork: claude,
          Codex: codex,
          Antigravity: anti,
          total: claude + codex + anti
        });
      }
      return data;
    }

    function formatNumberShort(num) {
      if (!num) return '0';
      if (num >= 1_000_000) return `${(num / 1_000_000).toFixed(2)}M`;
      if (num >= 1_000) return `${(num / 1_000).toFixed(1)}k`;
      return num.toLocaleString('th-TH');
    }

    function formatThaiDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getDate()} ${THAI_MONTHS_SHORT[d.getMonth()]}`;
    }

    function formatThaiMonth(yearMonth) {
      const [y, m] = yearMonth.split('-');
      const ty = parseInt(y, 10) + 543;
      return `${THAI_MONTHS_FULL[parseInt(m, 10) - 1]} ${ty}`;
    }

    function aggregateData(rawData, filterType, customStart, customEnd, daysLimit = 30) {
      if (!rawData || rawData.length === 0) return [];
      if (filterType === 'monthly') {
        const map = {};
        rawData.forEach(item => {
          const key = item.date.substring(0, 7);
          if (!map[key]) {
            map[key] = { label: formatThaiMonth(key), ClaudeCowork: 0, Codex: 0, Antigravity: 0, total: 0 };
          }
          map[key].ClaudeCowork += item.ClaudeCowork;
          map[key].Codex += item.Codex;
          map[key].Antigravity += item.Antigravity;
          map[key].total += item.total;
        });
        return Object.values(map);
      }

      let filtered = rawData;
      if (filterType === 'custom' && customStart && customEnd) {
        filtered = rawData.filter(d => d.date >= customStart && d.date <= customEnd);
      } else if (filterType === 'daily') {
        filtered = rawData.slice(-daysLimit);
      }

      return filtered.map(item => ({
        ...item,
        label: formatThaiDate(item.date)
      }));
    }

    function StandaloneDashboard() {
      const [dataSource, setDataSource] = useState('real');
      const [serverOnline, setServerOnline] = useState(false);
      const [rawData, setRawData] = useState([]);
      const [filterType, setFilterType] = useState('daily');
      const [dailyLimit, setDailyLimit] = useState(30);
      const [customStart, setCustomStart] = useState(() => {
        const d = new Date();
        d.setDate(d.getDate() - 14);
        return d.toISOString().split('T')[0];
      });
      const [customEnd, setCustomEnd] = useState(() => new Date().toISOString().split('T')[0]);
      
      const [visibleModels, setVisibleModels] = useState({
        ClaudeCowork: true,
        Codex: true,
        Antigravity: true
      });

      const [chartType, setChartType] = useState('line');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // โหลดข้อมูลจริงหรือข้อมูลจำลอง
      useEffect(() => {
        if (dataSource === 'real') {
          fetch('http://localhost:3001/api/tokens/history')
            .then(res => res.json())
            .then(json => {
              if (json.success && json.data.length > 0) {
                setRawData(json.data);
                setServerOnline(true);
              } else {
                setRawData(generateMockData());
              }
            })
            .catch(() => {
              setServerOnline(false);
              setRawData(generateMockData());
            });

          const es = new EventSource('http://localhost:3001/api/tokens/live');
          es.onopen = () => setServerOnline(true);
          es.onmessage = (e) => {
            try {
              const d = JSON.parse(e.data);
              if (d.type === 'CONNECTED') return;
              setRawData(prev => {
                const copy = [...prev];
                const today = new Date().toISOString().split('T')[0];
                const lastIdx = copy.findIndex(x => x.date === today);
                if (lastIdx >= 0) {
                  const item = { ...copy[lastIdx] };
                  item[d.provider] = (item[d.provider] || 0) + (d.totalTokens || 0);
                  item.total = (item.total || 0) + (d.totalTokens || 0);
                  copy[lastIdx] = item;
                } else {
                  copy.push({
                    date: today,
                    ClaudeCowork: d.provider === 'ClaudeCowork' ? d.totalTokens : 0,
                    Codex: d.provider === 'Codex' ? d.totalTokens : 0,
                    Antigravity: d.provider === 'Antigravity' ? d.totalTokens : 0,
                    total: d.totalTokens
                  });
                }
                return copy;
              });
            } catch(err){}
          };
          es.onerror = () => setServerOnline(false);
          return () => es.close();
        } else {
          setRawData(generateMockData());
          setServerOnline(false);
        }
      }, [dataSource]);

      const chartData = useMemo(() => {
        return aggregateData(rawData, filterType, customStart, customEnd, dailyLimit);
      }, [rawData, filterType, customStart, customEnd, dailyLimit]);

      const totals = useMemo(() => {
        let c = 0, x = 0, a = 0;
        chartData.forEach(row => {
          if (visibleModels.ClaudeCowork) c += (row.ClaudeCowork || 0);
          if (visibleModels.Codex) x += (row.Codex || 0);
          if (visibleModels.Antigravity) a += (row.Antigravity || 0);
        });
        const grand = c + x + a;
        const usd = (c / 1000 * 0.015) + (x / 1000 * 0.010) + (a / 1000 * 0.008);
        return { c, x, a, grand, usd, thb: usd * 35.5 };
      }, [chartData, visibleModels]);

      // Render or Update Chart.js
      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const labels = chartData.map(d => d.label);
        const datasets = [];

        if (visibleModels.ClaudeCowork) {
          datasets.push({
            label: 'ClaudeCowork',
            data: chartData.map(d => d.ClaudeCowork),
            borderColor: MODEL_CONFIGS.ClaudeCowork.color,
            backgroundColor: chartType === 'bar' ? MODEL_CONFIGS.ClaudeCowork.color : MODEL_CONFIGS.ClaudeCowork.bg,
            borderWidth: 2.5,
            fill: chartType === 'area',
            tension: 0.3
          });
        }
        if (visibleModels.Codex) {
          datasets.push({
            label: 'Codex',
            data: chartData.map(d => d.Codex),
            borderColor: MODEL_CONFIGS.Codex.color,
            backgroundColor: chartType === 'bar' ? MODEL_CONFIGS.Codex.color : MODEL_CONFIGS.Codex.bg,
            borderWidth: 2.5,
            fill: chartType === 'area',
            tension: 0.3
          });
        }
        if (visibleModels.Antigravity) {
          datasets.push({
            label: 'Antigravity',
            data: chartData.map(d => d.Antigravity),
            borderColor: MODEL_CONFIGS.Antigravity.color,
            backgroundColor: chartType === 'bar' ? MODEL_CONFIGS.Antigravity.color : MODEL_CONFIGS.Antigravity.bg,
            borderWidth: 2.5,
            fill: chartType === 'area',
            tension: 0.3
          });
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: chartType === 'area' ? 'line' : chartType,
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: {
                labels: { color: '#94a3b8', font: { family: 'Prompt', size: 12 } }
              },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                titleFont: { family: 'Prompt', size: 13 },
                bodyFont: { family: 'Prompt', size: 12 },
                padding: 12,
                borderColor: '#334155',
                borderWidth: 1,
                callbacks: {
                  label: (context) => ` ${context.dataset.label}: ${context.parsed.y.toLocaleString('th-TH')} Token`
                }
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(51, 65, 85, 0.3)' },
                ticks: { color: '#94a3b8', font: { family: 'Prompt' } }
              },
              y: {
                grid: { color: 'rgba(51, 65, 85, 0.3)' },
                ticks: {
                  color: '#94a3b8',
                  font: { family: 'Prompt' },
                  callback: (val) => formatNumberShort(val)
                }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [chartData, visibleModels, chartType]);

      const toggleModel = (key) => {
        setVisibleModels(prev => {
          const next = { ...prev, [key]: !prev[key] };
          if (!Object.values(next).some(Boolean)) return prev;
          return next;
        });
      };

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-800">
            <div>
              <h1 className="text-2xl md:text-3xl font-bold bg-gradient-to-r from-blue-400 via-indigo-200 to-purple-400 bg-clip-text text-transparent">
                📊 แดชบอร์ดติดตามการใช้งาน Token ของ AI
              </h1>
              <p className="text-sm text-slate-400 mt-1">
                ระบบสังเกตการณ์การใช้ Token สำหรับ ClaudeCowork, Codex และ Antigravity
              </p>
            </div>
            <div className="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
              <button
                onClick={() => setChartType('line')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${chartType === 'line' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
              >
                📈 กราฟเส้น
              </button>
              <button
                onClick={() => setChartType('bar')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${chartType === 'bar' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
              >
                📊 กราฟแท่ง
              </button>
              <button
                onClick={() => setChartType('area')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${chartType === 'area' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
              >
                🌊 พื้นที่สะสม
              </button>
            </div>
          </div>

          {/* KPI Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <p className="text-xs text-slate-400 font-semibold uppercase">ยอดรวม Token ทั้งหมด</p>
              <p className="text-3xl font-bold text-white mt-1 font-mono">{formatNumberShort(totals.grand)}</p>
              <p className="text-xs text-slate-500 mt-1">{totals.grand.toLocaleString('th-TH')} Tokens</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <p className="text-xs text-slate-400 font-semibold uppercase">ClaudeCowork</p>
              <p className="text-3xl font-bold text-purple-400 mt-1 font-mono">{formatNumberShort(totals.c)}</p>
              <p className="text-xs text-slate-500 mt-1">{totals.c.toLocaleString('th-TH')} Tokens</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <p className="text-xs text-slate-400 font-semibold uppercase">Codex</p>
              <p className="text-3xl font-bold text-emerald-400 mt-1 font-mono">{formatNumberShort(totals.x)}</p>
              <p className="text-xs text-slate-500 mt-1">{totals.x.toLocaleString('th-TH')} Tokens</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
              <p className="text-xs text-slate-400 font-semibold uppercase">Antigravity</p>
              <p className="text-3xl font-bold text-blue-400 mt-1 font-mono">{formatNumberShort(totals.a)}</p>
              <p className="text-xs text-slate-500 mt-1">≈ ${totals.usd.toFixed(2)} USD</p>
            </div>
          </div>

          {/* Controls */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div className="space-y-1.5">
                <span className="text-xs font-semibold text-slate-400 uppercase">มุมมองช่วงเวลา (Time Filter):</span>
                <div className="flex flex-wrap gap-2">
                  {[
                    { id: 'daily', label: '📅 รายวัน (Daily)' },
                    { id: 'custom', label: '⏳ กำหนดช่วงเวลาเอง' },
                    { id: 'monthly', label: '📆 รายเดือน (Monthly 6 เดือน)' }
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => setFilterType(item.id)}
                      className={`px-3.5 py-2 text-xs md:text-sm font-medium rounded-xl border transition-all ${
                        filterType === item.id ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-800 text-slate-300 border-slate-700'
                      }`}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-1.5">
                <span className="text-xs font-semibold text-slate-400 uppercase">เลือกเปิด/ปิดโมเดล:</span>
                <div className="flex flex-wrap gap-2">
                  {Object.entries(MODEL_CONFIGS).map(([key, config]) => (
                    <button
                      key={key}
                      onClick={() => toggleModel(key)}
                      className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium border ${
                        visibleModels[key] ? 'bg-slate-800 border-slate-600 text-white' : 'bg-slate-950/50 border-slate-800 text-slate-500'
                      }`}
                    >
                      <span className="w-3.5 h-3.5 rounded flex items-center justify-center text-[10px] text-white" style={{ backgroundColor: visibleModels[key] ? config.color : '#475569' }}>
                        {visibleModels[key] ? '✓' : ''}
                      </span>
                      <span>{config.name}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {filterType === 'custom' && (
              <div className="pt-3 border-t border-slate-800 flex flex-wrap items-center gap-3 text-xs">
                <span>ตั้งแต่วันที่:</span>
                <input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} className="bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-700" />
                <span>ถึงวันที่:</span>
                <input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} className="bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-700" />
              </div>
            )}
          </div>

          {/* Chart Section */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <h3 className="text-base font-bold text-white mb-4">📈 กราฟแสดงแนวโน้มการใช้งาน Token</h3>
            <div className="w-full h-[400px]">
              <canvas ref={chartRef}></canvas>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<StandaloneDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
